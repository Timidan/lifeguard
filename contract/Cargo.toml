[package]
name = "lifeguard"
version = "0.1.0"
edition = "2021"
description = "A NEAR contract that signs only loan-safe Aave transactions on Base for an AI agent"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
bs58 = "0.5.1"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
